name: Build Mod

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Modu derle
        run: gradle build

      - name: JAR yükle
        uses: actions/upload-artifact@v4
        with:
          name: ChestDrop-1.21.4
          path: build/libs/*.jar
